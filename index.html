<head lang="es">

<style>

        }

        }

        }

        50% {

            text-shadow: 3px 0 rgba(255, 0, 0, 0.9), -3px 0 rgba(0, 0, 255, 0.9);
        }

        }

        65% {

            text-shadow: 5px 0 rgba(255, 0, 0, 0.9), -5px 0 rgba(0, 0, 255, 0.9);
        }

        70% {
            transform: translate(1px, 1px);
            text-shadow: 3px 0 rgba(255, 0, 0, 0.9), -3px 0 rgba(0, 0, 255, 0.9);
        }

        75% {
            transform: translate(1px, 1px);
            text-shadow: 2px 0 rgba(255, 0, 0, 0.9), -2px 0 rgba(0, 0, 255, 0.9);
        }

        80% {
            transform: translate(2px, 1px);
            text-shadow: 5px 0 rgba(255, 0, 0, 0.9), -5px 0 rgba(0, 0, 255, 0.9);
        }

        85% {

            text-shadow: 3px 0 rgba(255, 0, 0, 0.9), -3px 0 rgba(0, 0, 255, 0.9);
        }

        }

    body,
    #screen {
        box-sizing: border-box;
        -webkit-user-select: none;
        -moz-user-select: none;
        -o-user-select: none;
        -ms-user-select: none;
        user-select: none;
    }

    body {
        margin: 0;
        background-color: #000;
        font-family: "Source Code Pro", monospace;
        overflow: hidden;
    }

    #screen:after {
        content: "";
        position: absolute;
        top: 30px;
        right: 30px;
        bottom: 30px;
        left: 30px;
        background-image: -webkit-linear-gradient(bottom, rgba(255, 255, 255, 0.2) 33.3%, rgba(255, 255, 255, 0.4) 33.3%, rgba(255, 255, 255, 0.4) 66.7%, rgba(255, 255, 255, 0.6) 66.7%), -webkit-linear-gradient(left, rgba(255, 0, 0, 0.7) 33.3%, rgba(0, 255, 0, 0.7) 33.3%, rgba(0, 255, 0, 0.6) 66.7%, rgba(0, 0, 255, 0.6) 66.7%);
        background-image: -moz-linear-gradient(bottom, rgba(255, 255, 255, 0.2) 33.3%, rgba(255, 255, 255, 0.4) 33.3%, rgba(255, 255, 255, 0.4) 66.7%, rgba(255, 255, 255, 0.6) 66.7%), -webkit-linear-gradient(left, rgba(255, 0, 0, 0.7) 33.3%, rgba(0, 255, 0, 0.7) 33.3%, rgba(0, 255, 0, 0.6) 66.7%, rgba(0, 0, 255, 0.6) 66.7%);
        background-image: linear-gradient(to top, rgba(255, 255, 255, 0.2) 33.3%, rgba(255, 255, 255, 0.4) 33.3%, rgba(255, 255, 255, 0.4) 66.7%, rgba(255, 255, 255, 0.6) 66.7%), linear-gradient(to right, rgba(255, 0, 0, 0.7) 33.3%, rgba(0, 255, 0, 0.7) 33.3%, rgba(0, 255, 0, 0.6) 66.7%, rgba(0, 0, 255, 0.6) 66.7%);
        background-size: 3px 3px;
        mix-blend-mode: multiply;
        border-radius: 5px;
        background-color: #00f;
    }

    #screen {
        margin: 30px;
        height: calc(100vh - 60px);
        width: calc(100vw - 60px);
        background: #0a0a0a;
        color: #fff;
        text-shadow: 2px 0 rgba(255, 0, 0, 0.9), -2px 0 rgba(0, 0, 255, 0.9);
        border-radius: 5px;
    }

    .on #screen {
        background-color: #222;
    }

    #content-holder {
        padding: 0;
        height: calc(100vh - 60px);
        width: calc(100vw - 60px);
        display: flex;
        justify-content: center;
        align-items: center;
        align-content: center;
        text-align: center;
        overflow: hidden;
    }

    #content {
        background-color: #b0b0b0;
        display: flex;
        justify-content: center;
        align-items: center;
        align-content: center;
        text-align: center;
        overflow: hidden;
        height: 0;
        position: relative;
    }

    .on #content {
        animation: screen-turn-on .4s linear .5s 1 forwards;
    }

    #power {
        bottom: 12px;
        width: 35px;
        height: 5px;
        position: absolute;
        right: 45px;
        background-color: #282828;
        cursor: pointer;
    }

    .on #power {
        background-color: #0035ff;
        box-shadow: 0px 0px 20px 2px #0035ff;
    }

    #channel {
        position: absolute;
        top: 15px;
        left: 25px;
        font-size: 4vw;
        font-family: "VT323", monospace;
        vertical-align: middle;
        color: #fbff68;
        animation: shiver 1s linear .5s infinite;
    }

    #text {
    color: #ededed;
    text-align: center;
    font-weight: 200;
    text-transform: uppercase;
    font-size: 3vw;
    animation: shiver 1s linear .5s infinite;

    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 20px;
}

#countdown {
    font-size: 3vw;
}

#birthdayVideo {
    width: 60%;
    max-width: 700px;
    border-radius: 8px;
    border: 2px solid rgba(255,255,255,.2);
    box-shadow: 0 0 20px rgba(255,255,255,.15);
}
#start-screen{
    position:fixed;
    inset:0;
    background:#000;
    display:flex;
    justify-content:center;
    align-items:center;
    z-index:9999;
}

#start-button{
    background:#111;
    color:#fff;
    border:2px solid #555;
    padding:20px 50px;
    font-size:2rem;
    font-family:"VT323", monospace;
    cursor:pointer;
    transition:.3s;
}

#start-button:hover{
    transform:scale(1.05);
    box-shadow:0 0 20px #cc00ff;
}

.hidden{
    display:none !important;
}

#musicToggle{
    position:absolute;
    top:25px;
    right:30px;
    z-index:1000;

    width:70px;
    height:70px;

    border:none;
    border-radius:50%;

    background:rgba(0,0,0,.5);
    color:white;

    font-size:1.3rem;
    cursor:pointer;

    backdrop-filter:blur(5px);

    transition:.2s;
}

#musicToggle{
    box-shadow:0 0 10px rgba(0,53,255,.5);
}

#musicToggle.playing{
    box-shadow:0 0 20px #0035ff;
}

#musicToggle:hover{
    transform:scale(1.1);
}

#text{
    color:#ededed;
    text-align:center;
    font-weight:200;
    text-transform:uppercase;

    font-size:clamp(1.2rem, 3vw, 3rem);

    animation:shiver 1s linear .5s infinite;

    display:flex;
    flex-direction:column;
    align-items:center;

    gap:20px;

    width:min(95vw, 1200px);
}

#countdown{
    font-size:clamp(1.5rem, 4vw, 4rem);
    line-height:1.2;
}

#birthdayVideo{
    width:min(90vw, 900px);
    max-height:50vh;

    object-fit:contain;

    border-radius:8px;
}

@media (max-width:768px){

    #screen{
        margin:10px;
        width:calc(100vw - 20px);
        height:calc(100vh - 20px);
    }

    #content-holder{
        width:100%;
        height:100%;
    }

    #channel{
        top:10px;
        left:15px;
        font-size:1.8rem;
    }

    #musicToggle{
        top:10px;
        right:10px;
        width:42px;
        height:42px;
    }

    }
}
</style>

<body id="wrapper" class="off">
    <div id="start-screen">
    <button id="start-button">
        ENCENDER TV
    </button>
</div>

<audio id="bgMusic" loop>
    <source src="kitty.mp3" type="audio/mpeg">
</audio>
    <div id="screen">
        <button id="musicToggle" title="Pausar música">
    ❚❚
</button>
        <div id="content-holder">
            <div id="content">
                <div id="app">
                    <div id="channel">05/08/2026</div>
                    <div id="text">
                        <div id="countdown">Calculando...</div>

                        <video id="birthdayVideo" autoplay muted loop playsinline>
                            <source src="video.mp4" type="video/mp4">
                            Tu navegador no soporta video.
                        </video>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <div id="power" onclick="power();"></div>
</body>

<script>

const music = document.getElementById("bgMusic");
const musicToggle = document.getElementById("musicToggle");

music.addEventListener('loadedmetadata', () => {
    music.currentTime = 9;
});


musicToggle.addEventListener("click", () => {

    if (music.paused) {

        music.play();
        musicToggle.innerHTML = "❚❚";
        musicToggle.title = "Pausar música";

    } else {

        music.pause();
        musicToggle.innerHTML = "▶";
        musicToggle.title = "Reproducir música";
    }

});

const startButton = document.getElementById("start-button");
const startScreen = document.getElementById("start-screen");

function iniciarExperiencia() {

    document.getElementById("wrapper").className = "on";

    music.volume = 0.5;

    music.play().catch(error => {
        console.log(error);
    });

    startScreen.classList.add("hidden");

    actualizarCuentaRegresiva();
    setInterval(actualizarCuentaRegresiva, 1000);
}

startButton.addEventListener("click", iniciarExperiencia);

function power() {

    const body = document.getElementById("wrapper");

    if (body.className === "on") {

        body.className = "off";

        music.pause();

        musicToggle.innerHTML = "▶";

    } else {

        body.className = "on";

        music.play();

        musicToggle.innerHTML = "❚❚";
    }
}
    function actualizarCuentaRegresiva() {

    const objetivo = new Date("2026-08-05T00:00:00");

    const ahora = new Date();
    const diferencia = objetivo - ahora;

    const countdown = document.getElementById("countdown");

    if (diferencia <= 0) {
        countdown.innerHTML = "¡FELIZ CUMPLEAÑOS!";
        return;
    }

    const dias = Math.floor(diferencia / (1000 * 60 * 60 * 24));

    const horas = Math.floor(
        (diferencia % (1000 * 60 * 60 * 24))
        / (1000 * 60 * 60)
    );

    const minutos = Math.floor(
        (diferencia % (1000 * 60 * 60))
        / (1000 * 60)
    );

    const segundos = Math.floor(
        (diferencia % (1000 * 60))
        / 1000
    );

if (dias > 1) {

    countdown.innerHTML = `
        ${dias} DÍAS<br>
        ${horas}:${String(minutos).padStart(2,'0')}:${String(segundos).padStart(2,'0')}
    `;

} else if (dias === 1) {

    countdown.innerHTML = `
        1 DÍA<br>
        ${horas}:${String(minutos).padStart(2,'0')}:${String(segundos).padStart(2,'0')}
    `;

} else {

    countdown.innerHTML = `
        ${horas}:${String(minutos).padStart(2,'0')}:${String(segundos).padStart(2,'0')}
    `;

}
}

actualizarCuentaRegresiva();
setInterval(actualizarCuentaRegresiva, 1000);
</script>
