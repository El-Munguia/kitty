<!doctype html>

<html lang="cs">

<head>

  <meta charset="utf-8" />

  <meta name="viewport" content="width=device-width,initial-scale=1" />

  <title>Hello Fanny</title>

  <!-- Fonts -->

  <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Poppins:wght@300;400;600&display=swap"
    rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Unkempt&display=swap" rel="stylesheet">

  <style>
    :root {

      --bg: #ffd9e0;
      --accent: #d14e83;
      --glow: 0 6px 18px rgba(235, 0, 98, 0.18);

    }

    /* Page reset */

    * {
      box-sizing: border-box
    }

    html,
    body {

      width: 100%;
      height: 100%;
      overflow: hidden;
      margin: 0;

      font-family: 'Poppins', system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial;

      -webkit-font-smoothing: antialiased;

      -moz-osx-font-smoothing: grayscale;

      background-image: url("fondo.png");
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;

      display: flex;

      align-items: center;

      justify-content: center;

    }

    /* Main card / stage */

    .stage {

      width: 100%;

      min-height: 100vh;

      padding: 48px 24px;

      display: flex;

      align-items: center;

      justify-content: center;

      position: relative;

      overflow: hidden;

    }

    .card {

      width: min(92vw, 700px);
      padding: clamp(22px, 4vw, 48px);


      text-align: center;


      border-radius: 20px;

      background: linear-gradient(180deg, rgba(255, 255, 255, 0.85), rgba(255, 255, 255, 0.7));

      box-shadow: var(--glow), 0 2px 8px rgba(0, 0, 0, 0.06);

      backdrop-filter: blur(6px);

      position: relative;

      z-index: 10;

    }

    /* Hello Kitty image */

    .hero-img {

      width: 120px;

      height: 120px;

      object-fit: contain;

      border-radius: 14px;

      box-shadow: 0 10px 30px rgba(255, 100, 160, 0.12);

      margin: 0 auto 12px;

      display: block;

    }

    /* Title with shiny effect */

    .title {
      font-family: 'Great Vibes', cursive;
      font-size: clamp(2.2rem, 8vw, 4rem);
      line-height: 1.15;
      margin: 6px 0 10px;
      position: relative;
      display: inline-block;
      padding: 8px 12px;

      text-shadow:
        0 2px 0 rgba(255, 255, 255, 0.6),
        0 6px 20px rgba(255, 100, 160, 0.18);

      background-image: linear-gradient(90deg,
          #d14e83 0%,
          #df8cad 30%,
          #d14e83 60%,
          #ca3772 100%);

      background-size: 800px 100%;
      animation: shimmer 5s linear infinite;

      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      text-wrap: balance;

    }

    .title span {
      display: inline-block;


      background-image: linear-gradient(90deg,
          #d14e83 0%,
          #df8cad 30%,
          #d14e83 60%,
          #ca3772 100%);

      background-size: 800px 100%;

      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;

      animation: shimmer 5s linear infinite;
    }

    @keyframes shimmer {

      0% {
        background-position: -400px 0;
      }

      100% {
        background-position: 400px 0;
      }

    }

    /* Subtitle with layered shadow to look embossed */

    .subtitle {

      font-size: clamp(1.2rem, 5vw, 2rem);

      margin: 6px 0 20px;
      font-family: 'Unkempt', cursive;

      color: var(--accent);

      font-weight: 600;

      text-shadow: 0 2px 0 #fff, 0 6px 18px rgba(255, 110, 150, 0.14);

    }

    /* small description */

    .desc {
      font-family: 'Unkempt', cursive;
      font-weight: 600;

      color: #d14e83;

      margin-bottom: 18px;
      font-size: clamp(1.05rem, 3.2vw, 1.3rem);
      line-height: 1.6;

    }


    /* hearts generated on click */

    .heart {

      position: absolute;
      z-index: 1000;

      font-size: 20px;

      pointer-events: none;

      transform: translate(-50%, -50%) scale(1);

      animation: floatUp 1600ms ease-out forwards;

      will-change: transform, opacity;

      text-shadow: 0 2px 6px rgba(0, 0, 0, 0.15);

    }

    @keyframes floatUp {

      0% {
        transform: translate(-50%, -50%) translateY(0) scale(0.8) rotate(0deg);
        opacity: 1;
      }

      60% {
        transform: translate(-50%, -50%) translateY(-80px) scale(1.15) rotate(-10deg);
        opacity: 0.95;
      }

      100% {
        transform: translate(-50%, -50%) translateY(-220px) scale(0.9) rotate(10deg);
        opacity: 0;
      }

    }

    /* small responsive tweaks */

    @media (max-width:600px) {

      .card {
        padding: 28px;
        border-radius: 14px;
      }

      .title {
        font-size: 40px;
      }

      .subtitle {
        font-size: 22px;
      }

      .hero-img {
        width: 90px;
        height: 90px;
      }

    }

    /* Textos flotantes */

    .falling-text {
      position: absolute;
      font-size: 20px;
      color: #ff69b4;
      pointer-events: none;
      white-space: nowrap;
      font-weight: bold;
      z-index: 0;
      opacity: .85;
      text-shadow: 1px 1px 3px rgba(255, 255, 255, .8);
      animation: fall linear forwards;
    }

    @keyframes fall {
      from {
        transform: translateY(-100px);
      }

      to {
        transform: translateY(calc(100vh + 100px));
      }
    }

    /* Kittys flotantes */

    .floating-kitty {
      position: absolute;
      width: clamp(45px, 15vw, 90px);
      height: clamp(45px, 15vw, 90px);
      object-fit: contain;
      pointer-events: none;
      z-index: 0;
      opacity: .8;
      animation: kittyFloat linear infinite;
    }

    @keyframes kittyFloat {
      0% {
        transform: translate(0, 0) rotate(0deg);
      }

      25% {
        transform: translate(50px, 40px) rotate(5deg);
      }

      50% {
        transform: translate(90px, 0) rotate(0deg);
      }

      75% {
        transform: translate(40px, -40px) rotate(-5deg);
      }

      100% {
        transform: translate(0, 0) rotate(0deg);
      }
    }
  </style>

</head>

<body class="stage" id="stage">


  <div class="card" aria-live="polite">
    <div class="subtitle">Feliz Cumpleaños <3 </div>
        <!-- replace src if you want your own image -->

        <img class="hero-img" src="https://i.pinimg.com/736x/f5/aa/2b/f5aa2b0a291ae54eb193de150ef968f4.jpg"
          alt="Hello Kitty">

        <h1 class="title">
          <span style="padding: 0 0 0 15px;">Fanny eres </span>
          <span style="padding: 0 15px 0 0;" id="titleMessage">especial</span>
        </h1>
        <p class="desc">No solo hoy, no solo ayer, no solo mañana, siempre, por que eres el motivo por el que corazon continuara latiendo.<br> <br> Att: Munguengue</p>






    </div>
    <audio id="bgMusic" loop>
      <source src="garota.mp3" type="audio/mpeg">
    </audio>
    <script>

      const isMobile = window.innerWidth < 768;
      const kittyCount = isMobile ? 7 : 14;
      const music = document.getElementById("bgMusic");

      let musicStarted = false;


      // --- Create hearts on click ---

      (function heartsOnClick() {

        const stage = document.getElementById('stage');

        const palette = ['#ff6ea3', '#ff95c5', '#ff3f8a', '#ffd1ea', '#ff7abf', '#ffffff'];

        function spawnHeart(x, y) {

          const heart = document.createElement('div');

          heart.className = 'heart';

          // random choose between emoji or CSS heart

          const useEmoji = Math.random() > 0.25;

          if (useEmoji) {

            // random emoji hearts

            const choices = ['💖', '💗', '💘', '💞', '💝', '💕', '❤️‍🔥'];

            heart.textContent = choices[Math.floor(Math.random() * choices.length)];

          } else {

            // fallback: simple text heart

            heart.textContent = '❤';

          }

          const size = 16 + Math.floor(Math.random() * 32);

          heart.style.left = x + 'px';

          heart.style.top = y + 'px';

          heart.style.fontSize = size + 'px';

          heart.style.opacity = 1;

          // color style via filter or color (emoji color varies). For text hearts, set color.

          heart.style.color = palette[Math.floor(Math.random() * palette.length)];

          // slight random delay/offset

          heart.style.transform = 'translate(-50%, -50%) scale(0.9) rotate(' + (Math.random() * 40 - 20) + 'deg)';

          stage.appendChild(heart);

          // cleanup after animation

          setTimeout(() => {

            heart.remove();

          }, 1800 + Math.random() * 400);

        }

        // on click anywhere in stage

        stage.addEventListener('click', function (e) {

          if (!musicStarted) {

            musicStarted = true;

            music.volume = 0;

            const startMusic = () => {
              music.currentTime = 30; // Comenzar en el segundo 32

              music.play().catch(() => { });

              const fade = setInterval(() => {

                if (music.volume < 0.5) {
                  music.volume = Math.min(0.5, music.volume + 0.05);
                } else {
                  clearInterval(fade);
                }

              }, 150);
            };

            if (music.readyState >= 1) {
              startMusic();
            } else {
              music.addEventListener("loadedmetadata", startMusic, { once: true });
            }
          }

          // create multiple hearts per click

          const howMany = isMobile
            ? 3 + Math.floor(Math.random() * 2)
            : 5 + Math.floor(Math.random() * 6);

          for (let i = 0; i < howMany; i++) {

            // small jitter positions

            const jitterX = e.clientX + (Math.random() * 80 - 40);

            const jitterY = e.clientY + (Math.random() * 40 - 20);

            setTimeout(() => spawnHeart(jitterX, jitterY), i * 60);

          }

        });

        // also spawn a few hearts on load for flair

        window.addEventListener('load', function () {

          const w = window.innerWidth, h = window.innerHeight;

          for (let i = 0; i < 10; i++) {

            setTimeout(() => {

              const x = (w / 2) + (Math.random() * 200 - 100);

              const y = (h / 2) + (Math.random() * 100 - 60);

              spawnHeart(x, y);

            }, 300 + i * 140);

          }

        });

      })();

      /* -----------------------------
       FRASES DEL TITULO
    ------------------------------*/

      const title = document.getElementById("titleMessage");

      const phrases = [
        "...",
        "todo",
        "muchas cosas",
        "especial 🌸",
        "hermosa 🌷",
        "maravillosa 💖",
        "única 💕",
        "increíble 🌸",
        "mi felicidad 💗",
        "mi lugar seguro 💝",
        "mi persona favorita 💖",
        "la casualidad más bonita 🌷",
        "el mejor regalo 🌸",
        "la sonrisa más linda 💕",
        "la razón de muchas sonrisas 🌼",
        "un sueño hecho realidad 🌹",
        "un rayito de luz 💐",
        "adorable 🌸",
        "encantadora 💖",
        "dulce 🌷",
        "tierna 💕",
        "brillante 🌼",
        "valiente 🌹",
        "auténtica 🌸",
        "inolvidable 💝",
        "extraordinaria 💖",
        "preciosa 🌷",
        "la definición de ternura 💕",
        "la mejor parte del día 🌸",
        "la calma entre el caos 🌷",
        "un corazón hermoso 💗",
        "una persona maravillosa 🌹",
        "mi pensamiento favorito 💖",
        "la inspiración de muchas sonrisas 🌸",
        "la prueba de que existe la magia 💐",
        "la mejor coincidencia 🌷",
        "más fuerte de lo que imaginas 💕",
        "más valiosa de lo que crees 🌸",
        "un pedacito de cielo 💖",
        "simplemente perfecta 🌹",
        "tan linda como hello kitty 🌸",
        "la flor más bonita 🌺",
        "la estrella que más brilla 💗",
        "la mejor compañía 🌷",
        "el abrazo que quisiera todos los días 💕",
        "la persona que alegra mi mundo 🌸",
        "la razón por la que sonrío 💖",
        "más especial de lo que imaginas 🌹",
        "todo lo bonito que existe 🌼",
        "la dueña de una sonrisa hermosa 🌷",
        "el mejor capítulo de la historia 💝",
        "la definición de belleza 🌸",
        "simplemente tú, y eso ya es perfecto 💖"
      ];

      let phraseIndex = 0;

      function changeTitle() {

        title.style.opacity = 0;

        setTimeout(() => {

          phraseIndex = (phraseIndex + 1) % phrases.length;

          title.textContent = phrases[phraseIndex];

          title.style.opacity = 1;

        }, 500);
      }

      title.style.transition = "opacity .5s ease";

      setInterval(changeTitle, 3000);

      /* -----------------------------
         TEXTOS FLOTANDO
      ------------------------------*/

      const floatingPhrases = [
        "💖",
        "Fanny",
        "Te quiero",
        "💕",
        "🎀",
        "🌸",
        "💝",
        "🐱",
        "✨",
        "Hermosa",
        "Feliz Cumpleaños",
        "🌷",
      ];

      function createFallingText() {

        const txt = document.createElement("div");

        txt.className = "falling-text";

        txt.textContent =
          floatingPhrases[
          Math.floor(Math.random() * floatingPhrases.length)
          ];

        txt.style.left =
          (Math.random() * 80 + 10) + "%";

        txt.style.animationDuration =
          (4 + Math.random() * 6) + "s";

        txt.style.fontSize =
          (16 + Math.random() * 16) + "px";

        document.body.appendChild(txt);

        setTimeout(() => {
          txt.remove();
        }, 10000);
      }

      setInterval(
        createFallingText,
        isMobile ? 900 : 350
      );
      /* -----------------------------
         HELLO KITTYS FLOTANTES
      ------------------------------*/

      const kittyImages = [
        'https://i.gifer.com/origin/1c/1c29154636f73295ad5fe84068c7a180_w200.gif',
        'https://i.pinimg.com/originals/91/a3/e1/91a3e1191b2506890b29f7e33f479709.gif',
        'https://i.pinimg.com/originals/ec/10/23/ec1023dc9c47eae35642c8845f8c3080.gif',
        'https://media1.giphy.com/media/jpqwTJ25fA9HzdeS8Z/source.gif',
        'https://i.pinimg.com/originals/29/fc/51/29fc5101151a16e9bc60e0cd1b447158.gif',
        'https://media.tenor.com/Lm5Zj59Qp0kAAAAM/sanrio-hello-kitty.gif',
        'https://i.pinimg.com/originals/6a/8a/cf/6a8acfe5d27e516abbf57e74e9849d7d.gif',
        'https://media1.tenor.com/m/oMM43p2kd3wAAAAC/game-video-games.gif'

      ];

      function createFloatingKitties() {

        for (let i = 0; i < kittyCount; i++) {

          const kitty = document.createElement("img");

          kitty.className = "floating-kitty";

          kitty.src =
            kittyImages[
            Math.floor(Math.random() * kittyImages.length)
            ];

          kitty.style.left =
            (Math.random() * 85) + "%";

          kitty.style.top =
            (Math.random() * 85) + "%";

          kitty.style.animationDuration =
            (10 + Math.random() * 10) + "s";

          kitty.style.animationDelay =
            (Math.random() * 5) + "s";

          document.body.appendChild(kitty);
        }
      }

      createFloatingKitties();

    </script>

</body>

</html>
